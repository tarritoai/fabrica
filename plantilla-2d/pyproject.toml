[project]
name = "reels"
version = "0.2.0"
description = "La fábrica 2D: de un guion (script.json) a un reel «¿Y si…?» dibujado por código (ElevenLabs, Remotion, ffmpeg)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.scripts]
reels = "reels.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reels"]
