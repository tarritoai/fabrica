[project]
name = "reels"
version = "0.1.0"
description = "La fábrica: de un guion (script.json) a un reel animado en 3D (ElevenLabs, Blender, Remotion, ffmpeg)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=1",
    "pydantic>=2.7",
    "numpy>=2.4.6",
]

[project.scripts]
reels = "reels.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reels"]
